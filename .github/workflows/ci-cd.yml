name: Unified Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize]

env:
  DOTNET_VERSION: '8.0.x'
  # Ajuste de caminhos baseado na estrutura padrão .NET
  SOLUTION_PATH: './UsersMembers.sln'
  # IMPORTANTE: Aponte para o projeto das LAMBDAS (Serverless), não o Infrastructure puro
  LAMBDA_PROJECT_PATH: './UsersMembers.Infrastructure.Serverless'
  # Onde está o código do CDK
  IAC_PROJECT_PATH: './UsersMembers.Infrastructure.IaC'
  # Pasta temporária para o artefato
  LAMBDA_PUBLISH_DIR: './lambda-publish'

jobs:
  # =========================================================
  # JOB 1: BUILD & TEST
  # =========================================================
  build_and_test:
    name: Build & Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache para performance (Nível Big Tech)
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build Solution (Release)
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run Unit Tests
      # Fail Fast: Se o teste falhar, para tudo.
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

    # Verificação de Segurança (Bloqueia se houver pacotes vulneráveis)
    - name: Security Audit
      run: |
        dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive > security_report.txt
        cat security_report.txt
        if grep -q "has the following vulnerable" security_report.txt; then
          echo "🚨 CRITICAL: Vulnerabilities Detected! Blocking Deploy."
          exit 1
        fi

    # Publica o projeto SERVERLESS (As Lambdas)
    - name: Publish Lambda Binaries
      run: |
        dotnet publish ${{ env.LAMBDA_PROJECT_PATH }} \
        -c Release \
        -o ${{ env.LAMBDA_PUBLISH_DIR }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lambda-build
        path: ${{ env.LAMBDA_PUBLISH_DIR }}
        retention-days: 1

  # =========================================================
  # JOB 2: DEPLOY (CDK)
  # =========================================================
  deploy:
    name: Deploy to AWS
    needs: build_and_test
    runs-on: ubuntu-latest
    # Só roda deploy se for push na main ou manual
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: lambda-build
        path: ${{ env.LAMBDA_PUBLISH_DIR }}

    - name: Setup Node.js (for CDK)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install AWS CDK
      run: npm install -g aws-cdk

    - name: Setup .NET for CDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Deploy com CDK
    - name: CDK Deploy
      env:
        # Caminho relativo: Do projeto IaC (../) volta pra raiz, depois entra na pasta de publish
        LAMBDA_BINARY_PATH: ../${{ env.LAMBDA_PUBLISH_DIR }}
      run: |
        cd ${{ env.IAC_PROJECT_PATH }}
        cdk deploy --require-approval never